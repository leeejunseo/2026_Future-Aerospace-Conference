# site/ 를 GitHub Pages 로 배포한다.
# 빌드는 하지 않는다. `python build_site.py` 로 만든 site/ 를 커밋해 두면 그대로 올린다.
# 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 해 두어야 동작한다.
name: GitHub Pages 배포

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
